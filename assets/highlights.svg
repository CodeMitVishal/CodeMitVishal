<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Highlights: 7+ years building cloud software, 7 certifications, led teams of 5 to 6 developers, 2,000+ community members. What I do: cloud platforms on Azure and Kubernetes, AI agents, security first, lead and teach.">
  <style>
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .in { opacity: 0; animation: in .55s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .icon { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    .d5 { animation-delay: .8s; } .d6 { animation-delay: .95s; } .d7 { animation-delay: 1.1s; } .d8 { animation-delay: 1.25s; }
    .i2 { animation-delay: .5s; } .i3 { animation-delay: 1s; } .i4 { animation-delay: 1.5s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="1198" height="418" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- numbers -->
  <g class="sans">
    <g class="in d1"><rect x="30" y="28" width="270" height="96" rx="14" fill="#161b22" stroke="#30363d"/><rect x="30" y="28" width="5" height="96" rx="2" fill="#7cc4ff"/>
      <text x="56" y="76" fill="#7cc4ff" font-size="36" font-weight="900">7+ years</text><text x="56" y="104" fill="#8b949e" font-size="16">building cloud software</text></g>
    <g class="in d2"><rect x="315" y="28" width="270" height="96" rx="14" fill="#161b22" stroke="#30363d"/><rect x="315" y="28" width="5" height="96" rx="2" fill="#b39dff"/>
      <text x="341" y="76" fill="#b39dff" font-size="36" font-weight="900">7 certs</text><text x="341" y="104" fill="#8b949e" font-size="16">6 from Microsoft (Azure &amp; AI)</text></g>
    <g class="in d3"><rect x="600" y="28" width="270" height="96" rx="14" fill="#161b22" stroke="#30363d"/><rect x="600" y="28" width="5" height="96" rx="2" fill="#7ee2a8"/>
      <text x="626" y="76" fill="#7ee2a8" font-size="36" font-weight="900">5–6 devs</text><text x="626" y="104" fill="#8b949e" font-size="16">led as a team lead</text></g>
    <g class="in d4"><rect x="885" y="28" width="285" height="96" rx="14" fill="#161b22" stroke="#30363d"/><rect x="885" y="28" width="5" height="96" rx="2" fill="#ffd43b"/>
      <text x="911" y="76" fill="#ffd43b" font-size="36" font-weight="900">2,000+</text><text x="911" y="104" fill="#8b949e" font-size="16">members in my community</text></g>
  </g>

  <text class="sans in d4" x="30" y="168" fill="#e6edf3" font-size="22" font-weight="800">What I do</text>

  <!-- what I do -->
  <g class="sans">
    <g class="in d5">
      <rect x="30" y="186" width="270" height="206" rx="16" fill="#161b22" stroke="#30363d"/>
      <text class="icon" x="54" y="244" font-size="40">☁️</text>
      <text x="54" y="286" fill="#e6edf3" font-size="21" font-weight="800">Cloud platforms</text>
      <text x="54" y="318" fill="#8b949e" font-size="16">Apps on Azure &amp; Kubernetes</text>
      <text x="54" y="340" fill="#8b949e" font-size="16">that scale on their own and</text>
      <text x="54" y="362" fill="#8b949e" font-size="16">deploy automatically.</text>
    </g>
    <g class="in d6">
      <rect x="315" y="186" width="270" height="206" rx="16" fill="#161b22" stroke="#30363d"/>
      <text class="icon i2" x="339" y="244" font-size="40">🤖</text>
      <text x="339" y="286" fill="#e6edf3" font-size="21" font-weight="800">AI agents</text>
      <text x="339" y="318" fill="#8b949e" font-size="16">AI helpers that use tools</text>
      <text x="339" y="340" fill="#8b949e" font-size="16">and company data, and help</text>
      <text x="339" y="362" fill="#8b949e" font-size="16">teams adopt AI safely.</text>
    </g>
    <g class="in d7">
      <rect x="600" y="186" width="270" height="206" rx="16" fill="#161b22" stroke="#30363d"/>
      <text class="icon i3" x="624" y="244" font-size="40">🔐</text>
      <text x="624" y="286" fill="#e6edf3" font-size="21" font-weight="800">Security first</text>
      <text x="624" y="318" fill="#8b949e" font-size="16">Sign-in, secrets and GDPR</text>
      <text x="624" y="340" fill="#8b949e" font-size="16">built in from day one, for</text>
      <text x="624" y="362" fill="#8b949e" font-size="16">insurance &amp; finance clients.</text>
    </g>
    <g class="in d8">
      <rect x="885" y="186" width="285" height="206" rx="16" fill="#161b22" stroke="#30363d"/>
      <text class="icon i4" x="909" y="244" font-size="40">🎓</text>
      <text x="909" y="286" fill="#e6edf3" font-size="21" font-weight="800">Lead &amp; teach</text>
      <text x="909" y="318" fill="#8b949e" font-size="16">Mentor developers and teach</text>
      <text x="909" y="340" fill="#8b949e" font-size="16">a free Python course for</text>
      <text x="909" y="362" fill="#8b949e" font-size="16">beginners on YouTube.</text>
    </g>
  </g>
</svg>
