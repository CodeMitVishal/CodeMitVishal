<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Certifications: Azure Solutions Architect Expert, Agentic AI Business Solutions Architect, Azure AI Apps and Agents Developer, Azure AI Engineer, Azure Developer, AI Transformation Leader, Certified ScrumMaster">
  <defs>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="268" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .b { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .sweep { animation: sweep 5s ease-in-out 2.5s infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px) skewX(-20deg); } 35%, 100% { transform: translateX(1400px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .b { opacity: 1; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="270" fill="#0d1117"/>
    <rect x="1" y="1" width="1198" height="268" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>
    <text class="sans" x="40" y="50" fill="#e6edf3" font-size="24" font-weight="800">🏅 Certifications</text>
    <text class="sans" x="1160" y="50" text-anchor="end" fill="#8b949e" font-size="16">6 × Microsoft · 1 × Scrum Alliance</text>

    <g class="sans" font-size="16" font-weight="700">
      <g class="b" style="animation-delay:.2s"><rect x="40" y="78" width="268" height="72" rx="14" fill="#161b22" stroke="#ffd43b" stroke-opacity=".8"/><text x="62" y="108" fill="#ffd43b" font-size="13" font-weight="800">EXPERT</text><text x="62" y="134" fill="#e6edf3">Azure Solutions Architect</text></g>
      <g class="b" style="animation-delay:.35s"><rect x="322" y="78" width="268" height="72" rx="14" fill="#161b22" stroke="#30363d"/><text x="344" y="108" fill="#b39dff" font-size="13" font-weight="800">AB-100</text><text x="344" y="134" fill="#e6edf3">Agentic AI Solutions Architect</text></g>
      <g class="b" style="animation-delay:.5s"><rect x="604" y="78" width="268" height="72" rx="14" fill="#161b22" stroke="#30363d"/><text x="626" y="108" fill="#b39dff" font-size="13" font-weight="800">ASSOCIATE</text><text x="626" y="134" fill="#e6edf3">Azure AI Apps &amp; Agents Dev</text></g>
      <g class="b" style="animation-delay:.65s"><rect x="886" y="78" width="274" height="72" rx="14" fill="#161b22" stroke="#30363d"/><text x="908" y="108" fill="#b39dff" font-size="13" font-weight="800">ASSOCIATE</text><text x="908" y="134" fill="#e6edf3">Azure AI Engineer</text></g>
      <g class="b" style="animation-delay:.8s"><rect x="40" y="166" width="268" height="72" rx="14" fill="#161b22" stroke="#30363d"/><text x="62" y="196" fill="#7cc4ff" font-size="13" font-weight="800">ASSOCIATE</text><text x="62" y="222" fill="#e6edf3">Azure Developer</text></g>
      <g class="b" style="animation-delay:.95s"><rect x="322" y="166" width="268" height="72" rx="14" fill="#161b22" stroke="#30363d"/><text x="344" y="196" fill="#7cc4ff" font-size="13" font-weight="800">MICROSOFT</text><text x="344" y="222" fill="#e6edf3">AI Transformation Leader</text></g>
      <g class="b" style="animation-delay:1.1s"><rect x="604" y="166" width="268" height="72" rx="14" fill="#161b22" stroke="#30363d"/><text x="626" y="196" fill="#7ee2a8" font-size="13" font-weight="800">SCRUM ALLIANCE</text><text x="626" y="222" fill="#e6edf3">Certified ScrumMaster</text></g>
      <g class="b" style="animation-delay:1.25s"><rect x="886" y="166" width="274" height="72" rx="14" fill="#161b22" stroke="#30363d" stroke-dasharray="6 6"/><text x="908" y="196" fill="#8b949e" font-size="13" font-weight="800">NEXT UP</text><text x="908" y="222" fill="#8b949e">Always learning… 📚</text></g>
    </g>
    <rect class="sweep" x="0" y="0" width="140" height="270" fill="url(#shine)"/>
  </g>
</svg>
