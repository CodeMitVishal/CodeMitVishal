<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="About me terminal: Cloud Engineer at baramundi software, building agentic AI, founder of The Growth Club">
  <style>
    .mono { font-family: "Cascadia Code", Consolas, Menlo, monospace; }
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .ln { opacity: 0; animation: show .35s ease-out forwards; }
    @keyframes show { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .cmd { animation: typecmd 1.2s steps(14) .3s both; }
    @keyframes typecmd { from { width: 0; } to { width: 420px; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ln { opacity: 1; } .cmd { width: 420px; } }
  </style>
  <defs><clipPath id="c"><rect class="cmd" x="58" y="64" width="0" height="34"/></clipPath></defs>

  <rect x="1" y="1" width="1198" height="378" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="44" rx="20" fill="#161b22"/>
  <rect x="1" y="24" width="1198" height="21" fill="#161b22"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text class="sans" x="600" y="29" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="600">vishal@growth-club: ~</text>

  <g class="mono" font-size="20">
    <text x="30" y="88" fill="#7ee2a8" font-weight="700">$</text>
    <g clip-path="url(#c)"><text x="58" y="88" fill="#e6edf3" font-weight="700">cat about_me.py</text></g>

    <g font-size="19">
      <text class="ln" style="animation-delay:1.6s" x="30" y="128"><tspan fill="#ff7ab6">class</tspan><tspan fill="#ffd43b"> VishalSingh</tspan><tspan fill="#e6edf3">:</tspan></text>
      <text class="ln" style="animation-delay:1.9s" x="62" y="160"><tspan fill="#7cc4ff">role</tspan><tspan fill="#e6edf3">       = </tspan><tspan fill="#7ee2a8">"Cloud Engineer @ baramundi software, Germany"</tspan></text>
      <text class="ln" style="animation-delay:2.2s" x="62" y="190"><tspan fill="#7cc4ff">cloud</tspan><tspan fill="#e6edf3">      = [</tspan><tspan fill="#7ee2a8">"Azure"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"AKS"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"KEDA"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"ArgoCD"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"Terraform"</tspan><tspan fill="#e6edf3">]</tspan></text>
      <text class="ln" style="animation-delay:2.5s" x="62" y="220"><tspan fill="#7cc4ff">building</tspan><tspan fill="#e6edf3">   = [</tspan><tspan fill="#7ee2a8">"AI agents"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"MCP tools"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"RAG on Azure AI Search"</tspan><tspan fill="#e6edf3">]</tspan></text>
      <text class="ln" style="animation-delay:2.8s" x="62" y="250"><tspan fill="#7cc4ff">code</tspan><tspan fill="#e6edf3">       = [</tspan><tspan fill="#7ee2a8">"C# / .NET"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"Angular"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"TypeScript"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee2a8">"Python"</tspan><tspan fill="#e6edf3">]</tspan></text>
      <text class="ln" style="animation-delay:3.1s" x="62" y="280"><tspan fill="#7cc4ff">founder_of</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#7ee2a8">"The Growth Club 🌿 – code, languages &amp; philosophy"</tspan></text>
      <text class="ln" style="animation-delay:3.4s" x="62" y="310"><tspan fill="#7cc4ff">ask_me</tspan><tspan fill="#e6edf3">     = </tspan><tspan fill="#7ee2a8">"cloud architecture, agentic AI, Python for beginners"</tspan></text>
    </g>

    <text class="ln" style="animation-delay:3.9s" x="30" y="352" fill="#7ee2a8" font-weight="700">$</text>
    <rect class="ln cursor" style="animation-delay:3.9s" x="56" y="336" width="12" height="22" fill="#e6edf3"/>
  </g>
</svg>
