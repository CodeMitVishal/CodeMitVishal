<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Vishal Singh — Cloud Engineer, Agentic AI builder, Founder of The Growth Club">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#3776ab" stop-opacity=".75"/><stop offset="1" stop-color="#3776ab" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGold"><stop offset="0" stop-color="#ffd43b" stop-opacity=".35"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe67a"/><stop offset=".6" stop-color="#ffd43b"/><stop offset="1" stop-color="#f5b700"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <clipPath id="type"><rect class="typer" x="80" y="190" width="0" height="56"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, Menlo, monospace; }
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(-160px, 40px); } }
    @keyframes drift2 { to { transform: translate(140px, -30px); } }
    .hello { opacity: 0; animation: up .8s ease-out .2s forwards; }
    .name { opacity: 0; animation: up .8s ease-out .5s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .wave { transform-origin: 368px 72px; transform-box: view-box; animation: wave 2.4s ease-in-out 1s infinite; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-8deg); } }
    /* four roles, each typed then held, 4s per role */
    .role { opacity: 0; animation: role 16s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; }
    @keyframes role { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .typer { animation: type 4s steps(28) infinite; }
    @keyframes type { 0% { width: 0; } 45%, 90% { width: 760px; } 100% { width: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sweep { animation: sweep 6s ease-in-out 1.5s infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 40%, 100% { transform: translateX(1300px); } }
    .chip { opacity: 0; animation: up .6s ease-out forwards; }
    .c1 { animation-delay: 1.1s; } .c2 { animation-delay: 1.3s; } .c3 { animation-delay: 1.5s; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hello, .name, .chip, .r1 { opacity: 1; }
      .typer { width: 760px; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb1" cx="1000" cy="120" r="260" fill="url(#glowBlue)"/>
    <circle class="orb2" cx="160" cy="330" r="220" fill="url(#glowGold)"/>

    <text class="sans hello" x="80" y="84" fill="#9fb3d9" font-size="30" font-weight="600">Hi there, I'm</text>
    <text class="wave" x="350" y="86" font-size="34">👋</text>

    <text class="sans name" x="76" y="160" fill="url(#gold)" font-size="84" font-weight="900" letter-spacing="-2">Vishal Singh</text>

    <g clip-path="url(#type)">
      <text class="mono role r1" x="80" y="232" fill="#7cc4ff" font-size="34" font-weight="700">&gt; Cloud Engineer · Azure &amp; Kubernetes</text>
      <text class="mono role r2" x="80" y="232" fill="#b39dff" font-size="34" font-weight="700">&gt; Agentic AI builder · MCP · RAG</text>
      <text class="mono role r3" x="80" y="232" fill="#7ee2a8" font-size="34" font-weight="700">&gt; Founder @ The Growth Club 🌿</text>
      <text class="mono role r4" x="80" y="232" fill="#ffd43b" font-size="34" font-weight="700">&gt; Teaching Python on YouTube 🐍</text>
    </g>

    <g class="sans" font-size="18" font-weight="700">
      <g class="chip c1"><rect x="80" y="262" width="230" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="195" y="286" text-anchor="middle" fill="#dbe7ff">📍 Augsburg, Germany</text></g>
      <g class="chip c2"><rect x="324" y="262" width="250" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="449" y="286" text-anchor="middle" fill="#dbe7ff">⚡ 7+ years shipping cloud</text></g>
      <g class="chip c3"><rect x="588" y="262" width="250" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="713" y="286" text-anchor="middle" fill="#dbe7ff">🏅 7 Microsoft &amp; Scrum certs</text></g>
    </g>

    <!-- decorative code window -->
    <g transform="translate(905 70)">
      <rect width="230" height="180" rx="16" fill="#141c33" stroke="#2d3d66" stroke-width="2"/>
      <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
      <g class="mono" font-size="15" font-weight="600">
        <text x="20" y="64" fill="#ff7ab6">while</text><text x="72" y="64" fill="#dbe7ff">alive:</text>
        <text x="40" y="92" fill="#7cc4ff">learn()</text>
        <text x="40" y="120" fill="#7ee2a8">build()</text>
        <text x="40" y="148" fill="#ffd43b">share()</text>
        <rect class="cursor" x="110" y="134" width="9" height="18" fill="#ffd43b"/>
      </g>
    </g>

    <rect class="sweep" x="0" y="0" width="160" height="320" fill="url(#shine)" opacity=".06" transform="skewX(-20)"/>
  </g>
</svg>
